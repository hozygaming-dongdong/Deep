<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<script>
(() => {
  if (window.__DEEPER_ZOOM_GUARD__) return;
  window.__DEEPER_ZOOM_GUARD__ = true;
  const setViewportSize = () => {
    const vv = window.visualViewport;
    const w = Math.round(vv?.width || window.innerWidth || document.documentElement.clientWidth);
    const h = Math.round(vv?.height || window.innerHeight || document.documentElement.clientHeight);
    document.documentElement.style.setProperty('--app-width', `${w}px`);
    document.documentElement.style.setProperty('--app-height', `${h}px`);
    window.dispatchEvent(new Event('deeper:viewport'));
  };
  let lastTouchStart = 0;
  let lastTouchEnd = 0;
  const TAP_WINDOW = 420;
  const opts = { capture: true, passive: false };
  const stop = e => e.preventDefault();
  const multiTouch = e => e.touches && e.touches.length > 1;

  document.addEventListener('touchstart', e => {
    const now = Date.now();
    if (multiTouch(e) || now - lastTouchStart < TAP_WINDOW) e.preventDefault();
    lastTouchStart = now;
  }, opts);
  document.addEventListener('touchmove', e => {
    if (multiTouch(e)) e.preventDefault();
  }, opts);
  document.addEventListener('touchend', e => {
    const now = Date.now();
    if (now - lastTouchEnd < TAP_WINDOW) e.preventDefault();
    lastTouchEnd = now;
  }, opts);
  document.addEventListener('dblclick', stop, opts);
  document.addEventListener('click', e => {
    if (e.detail > 1) e.preventDefault();
  }, opts);
  ['gesturestart', 'gesturechange', 'gestureend'].forEach(type => {
    document.addEventListener(type, stop, opts);
  });
  setViewportSize();
  window.addEventListener('resize', setViewportSize, { passive: true });
  window.addEventListener('orientationchange', () => setTimeout(setViewportSize, 80), { passive: true });
  window.visualViewport?.addEventListener('resize', setViewportSize, { passive: true });
  window.visualViewport?.addEventListener('scroll', setViewportSize, { passive: true });
})();
</script>

  canvas{position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none}
  #boot,.bal,#betTile,.btn{touch-action:none}

  /* v2.2 — the top bar carries ONE thing: what you have. The version badge and

  #top{position:absolute; top:0; left:0; right:0; z-index:20; display:flex; align-items:center; justify-content:center;
    padding:env(safe-area-inset-top,10px) 14px 8px; background:linear-gradient(180deg,rgba(5,8,10,.85),rgba(5,8,10,0))}
  .bal{display:flex; flex-direction:column; align-items:center; line-height:1; cursor:pointer; position:relative}
  .bal .lab{font-size:9px; letter-spacing:.14em; color:var(--ash); text-transform:uppercase; font-weight:600;
    display:flex; align-items:center; justify-content:center; gap:6px}
  /* the wallet chip: tap to switch 1:1 cash ⇄ 1:100 points (display only) */
  .bal .lab b{font-size:8px; letter-spacing:.12em; font-weight:800; color:var(--gold-mid);
    border:1px solid rgba(200,146,46,.45); border-radius:2px; padding:2px 4px 1px; background:rgba(110,74,18,.28)}
  .bal .lab b::after{content:' ⇄'; opacity:.75}
  .bal:active .lab b{background:rgba(246,194,67,.3); color:var(--gold-hi)}
  .bal .val{font-family:var(--font-display); font-size:23px; font-weight:800; font-variant-numeric:tabular-nums; color:var(--gold-mid); margin-top:2px; display:inline-block}
  .bal .val.charged{animation:costPulse .4s ease}
  @keyframes costPulse{0%{transform:translateX(-2px) scale(1.16); color:var(--gold-hi)}30%{transform:translateX(2px) scale(1.05)}60%{transform:translateX(-1px) scale(.98)}100%{transform:translateX(0) scale(1); color:var(--gold-mid)}}
  /* ~~.bal .ante~~ (v2.3, retired in v2.3b) — a gold "ANTE ×1" rose off the

     explaining. Once every segment antes it became 27 identical flourishes per
     dive, so the balance's own gold pulse carries it alone now. */

  #dock{position:absolute; left:0; right:0; bottom:0; z-index:20; padding:14px 14px calc(env(safe-area-inset-bottom,10px) + 14px);
    background:linear-gradient(180deg,rgba(7,11,14,0),rgba(7,11,14,.92) 22%,#04070a); border-top:1px solid var(--dock-edge)}
  .readouts{display:grid; grid-template-columns:minmax(58px,.72fr) minmax(66px,.92fr) minmax(66px,.92fr) minmax(112px,1.44fr);
    align-items:center; gap:8px; margin-bottom:12px}
  .ro{min-width:0; display:flex; flex-direction:column; align-items:center; line-height:1; text-align:center}
  .ro .lab{font-size:9px; letter-spacing:.16em; color:var(--ash); text-transform:uppercase; font-weight:600; margin-bottom:4px}
  .ro .num{font-family:var(--font-display); font-weight:900; font-variant-numeric:tabular-nums; line-height:.85;
